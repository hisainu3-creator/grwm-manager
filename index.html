<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRWM タイマー | 出発時刻から逆算する支度アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Lora:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     デザイントークン(色・フォント)
     ------------------------------------------------------------
     お渡しいただいた DESIGN-starbucks.md の配色・書体ルールを
     そのまま移植した「試し当て」バージョン。
     - クリーム地(#f2f0eb)の温かい紙のような背景
     - House Green(#1E3932)の濃色帯 = 出発カウントの帯(エスプレッソの
       ダークで挟む構成をそのまま踏襲。元は駅の発車標だった部分を
       "コーヒーショップの黒板メニュー"のトーンに翻訳)
     - Green Accent(#00754A) = 現在のタスク・メインCTA
     - Gold(#cba258) = ご褒美演出。完了画面でのみ使用(乱用しない)
     - 数字だけ Lora(セリフ)にして黒板メニューのような温かみを演出
     - SoDoSansは独自書体のため、md記載の代替指定どおりManropeを使用
       (日本語部分はNoto Sans JPに自動フォールバック)
     ========================================================== */
  :root{
    --bg:#f2f0eb;            /* Neutral Warm: ページ全体のクリーム背景 */
    --panel:#ffffff;         /* White: カード面 */
    --panel-2:#edebe9;       /* Ceramic: 入力欄・淡い区切り面 */
    --line:rgba(0,0,0,.12);  /* 罫線 */
    --field-line:#d6dbde;    /* フォーム罫線(mdの入力欄仕様どおり) */

    --dark:#1E3932;          /* House Green: 濃色帯(出発カウント) */
    --dark-text:rgba(255,255,255,.92);
    --dark-text-soft:rgba(255,255,255,.70);

    --brand:#006241;         /* Starbucks Green: 見出し */
    --accent:#00754A;        /* Green Accent: メインCTA・現在タスクの数字 */
    --accent-light:#d4e9e2;  /* 順調時の淡いグリーン washed */
    --gold:#cba258;          /* Gold: 完了画面のご褒美演出専用 */
    --danger:#c82014;        /* Red: 遅延・警告 */
    --danger-tint:rgba(200,32,20,.06);

    --text:rgba(0,0,0,.87);      /* Text Black */
    --muted:rgba(0,0,0,.58);     /* Text Black Soft */

    --font-ui:'Manrope','Noto Sans JP',sans-serif;   /* UI全般(SoDoSansの代替) */
    --font-num:'Lora', Georgia, serif;               /* カウントダウン数字(黒板メニュー風セリフ) */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    letter-spacing:-0.01em;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    max-width:520px;
    margin:0 auto;
    padding:20px 16px 80px;
  }

  /* ---------- ヘッダー ---------- */
  header.app-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  header.app-head h1{
    font-size:16px;
    letter-spacing:-0.01em;
    font-weight:800;
    margin:0;
    color:var(--muted);
  }
  header.app-head h1 b{ color:var(--accent); }
  .mode-switch{
    display:flex;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;         /* Starbucksのフルピル形状 */
    overflow:hidden;
    font-size:12px;
    padding:3px;
  }
  .mode-switch button{
    background:transparent;
    border:none;
    color:var(--muted);
    padding:6px 12px;
    border-radius:999px;
    font-family:var(--font-ui);
    font-weight:700;
    cursor:pointer;
  }
  .mode-switch button.active{
    background:var(--accent);
    color:#fff;
  }

  /* ---------- 出発カウント帯(House Greenの濃色帯) ---------- */
  /* 一番大事な「出るまでの残り時間」をヒーロー表示にする(最優先で目立たせる) */
  .board{
    background:var(--dark);
    border-radius:12px;
    padding:14px 18px 16px;
    margin-bottom:10px;
    color:var(--dark-text);
    text-align:center;
  }
  .board-label{ font-size:11px; color:var(--dark-text-soft); letter-spacing:.06em; }
  .board-hero{
    font-family:var(--font-num);
    font-size:46px;
    font-weight:700;
    line-height:1.1;
    margin:2px 0;
    color:var(--accent-light);   /* 順調時 */
  }
  .board-hero.warn{ color:#ff9a8f; }  /* 遅刻の危険がある時 */
  .board-sub{ font-size:11px; color:var(--dark-text-soft); margin-top:2px; }

  /* ---------- 現在のタスク(白カード・whisperシャドウ) ---------- */
  /* 全体の残り時間より優先度を下げて、コンパクトに */
  .tile{
    background:var(--panel);
    border-radius:12px;
    padding:14px 18px 16px;
    text-align:center;
    margin-bottom:10px;
    box-shadow:0 0 0.5px rgba(0,0,0,.14), 0 1px 8px rgba(0,0,0,.10);
    position:relative;
  }
  .tile.flip{ animation:flap .32s ease; }
  @keyframes flap{
    0%{ transform:translateY(6px); opacity:.3; }
    100%{ transform:translateY(0); opacity:1; }
  }
  .tile-eyebrow{ font-size:10px; letter-spacing:.14em; color:var(--muted); }
  .tile-task{
    font-size:18px;
    font-weight:800;
    margin:4px 0 6px;
    color:var(--brand);
    word-break:break-word;
  }
  .tile-count{
    font-family:var(--font-num);
    font-size:26px;              /* 全体の残り時間(board-hero)より小さく、脇役に */
    font-weight:700;
    color:var(--accent);
    line-height:1;
  }
  .tile-count.behind{ color:var(--danger); }
  .tile-next{ font-size:11px; color:var(--muted); margin-top:6px; }

  .tile-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:12px 10px;
    border-radius:50px;          /* Starbucksのフルピルボタン */
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:700;
    letter-spacing:-0.01em;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:active{ transform:scale(.95); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.warn{ background:transparent; color:var(--danger); border-color:var(--danger); }
  .btn.ghost{ background:transparent; color:var(--muted); }

  /* ---------- 「ながら準備」フローティングボタン(Starbucksの Frap CTA を踏襲) ---------- */
  .frap-btn{
    position:fixed;
    right:max(20px, calc((100vw - 520px)/2 + 20px));
    bottom:90px;              /* Safari下部のツールバーと被らない高さに調整 */
    width:72px; height:72px;  /* タップしやすいよう拡大 */
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:30px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 6px rgba(0,0,0,.24), 0 8px 16px rgba(0,0,0,.18);
    cursor:pointer;
    z-index:50;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .frap-btn:active{ transform:scale(.95); box-shadow:0 8px 12px rgba(0,0,0,0); }

  .start-btn-top{
    width:100%;
    padding:14px;
    border-radius:50px;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:14px;
    letter-spacing:-0.01em;
    border:none;
    cursor:pointer;
    margin-bottom:14px;
    transition:transform .2s ease;
  }
  .start-btn-top:active{ transform:scale(.97); }

  /* ---------- 進捗バー ---------- */
  .progress-wrap{ margin-bottom:14px; }
  .progress-track{
    height:8px;
    background:var(--panel-2);
    border-radius:8px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .3s ease;
  }
  .progress-text{ font-size:11px; color:var(--muted); margin-top:6px; text-align:right; }

  /* ---------- 時間+現在のタスクを画面上部に固定 ---------- */
  .sticky-top{
    position:sticky;
    top:0;
    background:var(--bg);
    padding-top:4px;
    margin:0 -16px 10px;
    padding-left:16px;
    padding-right:16px;
    padding-bottom:4px;
    z-index:40;
  }

  /* ---------- タイムライン(縦スクロール・アイコン付き) ---------- */
  .timeline{
    display:flex;
    flex-direction:column;
    margin-bottom:20px;
  }
  .timeline-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    position:relative;
    padding-bottom:20px;
  }
  .timeline-row:last-child{ padding-bottom:0; }
  .timeline-row::before{
    /* 各アイコンをつなぐ縦線(参考画像のタイムライン風)。
       見えにくいという指摘があったため、線をやや太く・濃くしてある。
       完了したタスクの区間はGreen Accentで塗って進捗が一目で分かるようにした。 */
    content:"";
    position:absolute;
    left:17px;
    top:36px;
    bottom:-2px;
    width:3px;
    background:rgba(0,0,0,.18);
  }
  .timeline-row.done::before{ background:var(--accent); }
  .timeline-row:last-child::before{ display:none; }
  .timeline-icon{
    flex:0 0 auto;
    width:36px; height:36px;
    border-radius:50%;
    background:var(--panel);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    z-index:1;
  }
  .timeline-row.current .timeline-icon{ background:var(--accent-light); border-color:var(--accent); }
  .timeline-row.done .timeline-icon{ opacity:.45; }
  .timeline-row.skipped .timeline-icon{ opacity:.3; }
  .timeline-body{ flex:1; padding-top:6px; min-width:0; }
  .timeline-name{ font-size:14px; font-weight:700; color:var(--text); }
  .timeline-row.done .timeline-name, .timeline-row.skipped .timeline-name{
    color:var(--muted); text-decoration:line-through; font-weight:500;
  }
  .timeline-time{ font-family:var(--font-num); font-size:11px; color:var(--muted); margin-top:2px; }
  .timeline-status{ font-size:11px; color:var(--accent); margin-top:2px; font-weight:700; }

  /* ---------- 遅延時のスキップ提案 ---------- */
  .suggest{
    background:var(--danger-tint);
    border:1px solid var(--danger);
    border-radius:12px;
    padding:10px 12px;
    font-size:12px;
    margin-bottom:10px;
    color:var(--text);
  }
  .suggest b{ color:var(--danger); }
  .suggest .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{
    background:#fff;
    border:1px solid var(--danger);
    color:var(--danger);
    border-radius:999px;
    padding:5px 12px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }

  /* ---------- 完了画面 ---------- */
  .finish{ text-align:center; padding:40px 10px; }
  .finish .big{ font-size:32px; font-weight:800; margin-bottom:8px; color:var(--brand); }
  .finish .big.reward{ color:var(--gold); }
  .finish p{ color:var(--muted); font-size:13px; }

  /* ---------- 設定モード ---------- */
  .setup-block{
    background:var(--panel);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
    box-shadow:0 0 0.5px rgba(0,0,0,.10);
  }
  .setup-block h2{ font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; font-weight:700; text-transform:uppercase; }
  .time-row{ display:flex; gap:10px; }
  .field{ flex:1; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:4px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .field input[type=time], .field input[type=text], .field input[type=number]{
    width:100%;
    background:#fff;
    border:1px solid var(--field-line);
    color:var(--text);
    border-radius:4px;
    padding:9px 10px;
    font-family:var(--font-ui);
    font-size:14px;
  }
  .budget-note{ font-size:11px; margin-top:8px; color:var(--muted); }
  .budget-note.over{ color:var(--danger); font-weight:700; }

  .task-row{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .task-row:last-child{ border-bottom:none; }
  .task-row .order-btns{ display:flex; flex-direction:column; gap:2px; }
  .order-btns button{
    background:none; border:none; color:var(--muted);
    font-size:10px; cursor:pointer; padding:0 4px;
  }
  .task-row input[type=text]{ flex:2; min-width:0; }
  .task-row input[type=number]{ flex:0 0 62px; text-align:center; }
  .task-row .star{ background:none; border:none; font-size:16px; cursor:pointer; color:var(--gold); }
  .task-row .star.low{ opacity:.3; color:var(--muted); }
  .task-row .del{ background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; }

  .add-row{ display:flex; gap:6px; margin-top:10px; }
  .add-row input[type=text]{ flex:2; }
  .add-row input[type=number]{ flex:0 0 62px; }

  .start-btn{
    width:100%;
    padding:16px;
    border-radius:50px;      /* フルピル */
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:15px;
    letter-spacing:-0.01em;
    border:none;
    cursor:pointer;
    transition:transform .2s ease;
  }
  .start-btn:active{ transform:scale(.97); }

  .voice-toggle{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--panel-2);
    border:1px solid var(--line);
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .voice-toggle.on{ background:var(--accent-light); border-color:var(--accent); }

  .save-note{ text-align:center; font-size:11px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>

<div class="app" id="app"><!-- JSがここに全画面を描画する --></div>

<!-- ========================================================
     「ながら準備(PinP)」用の非表示パーツ
     - canvas: カウントダウンの絵を毎秒描き直す下書き
     - video : canvasの中身を"動画"として偽装するための箱
       (ブラウザのPinP機能はvideo要素にしか使えないので、
        canvasの映像をvideoに流し込んで動画のフリをさせる)
     ======================================================== -->
<canvas id="pipCanvas" width="320" height="180" style="display:none"></canvas>
<video id="pipVideo" muted playsinline style="display:none"></video>

<script>
/* ============================================================
   GRWM タイマー ロジック
   ------------------------------------------------------------
   全体の考え方:
   1. state という1つのオブジェクトに「起きる時刻/家を出る時刻/
      タスク一覧/現在の実行状況」を全部持たせる
   2. state が変わるたびに render() を呼んで画面を全部作り直す
      (Reactを使わず素のJSでReactっぽい"状態→描画"の形にしている)
   3. window.storage (Claudeのアーティファクト用の保存API)を使って
      「起きる時刻/家を出る時刻/タスク一覧」だけを保存する
      (実行中の進捗はブラウザを閉じたらリセットされる仕様)
   ============================================================ */

// ---- 初期タスク(久恵さんが挙げてくれたリストをそのまま初期値に) ----
// duration: 分単位。小数もOK(例 0.5 = 30秒)。setup画面でいつでも変更可能。
// priority: "high" = 削れない必須タスク / "low" = 遅れたときにスキップ候補になるタスク
const DEFAULT_TASKS = [
  ["起きる",1,"high"], ["トイレ行く",2,"high"], ["顔洗う",2,"high"],
  ["化粧水",1,"low"], ["美容液",1,"low"], ["乳液",1,"low"], ["クリーム",1,"low"],
  ["目元クリーム",1,"low"], ["着替えを選ぶ",2,"low"], ["着替える",3,"high"],
  ["ヘアオイル",1,"low"], ["ドライヤー",5,"high"], ["日焼け止め",1,"high"],
  ["リキッドファンデ",2,"high"], ["パウダーつける",1,"low"], ["ビューラー",1,"low"],
  ["アイメイク",2,"low"], ["アイライン",2,"low"], ["マスカラ",1,"low"],
  ["リップライン",1,"low"], ["リップ",1,"low"], ["チーク",1,"low"],
  ["シェーディング",1,"low"], ["ハイライト",1,"low"], ["仕上げスプレー",1,"low"],
  ["ストレートアイロン/コテ",5,"low"], ["ワックスで固める",1,"low"],
  ["お湯を沸かす",3,"high"], ["朝ごはんを食べる",10,"high"], ["皿を洗う",3,"low"],
  ["お弁当と水筒をバッグに入れる",2,"high"], ["家を出る",1,"high"]
].map((t,i)=>({ id:"t"+i, name:t[0], seconds:Math.round(t[1]*60), priority:t[2] }));

// ---- アプリ全体の状態 ----
let state = {
  screen: "setup",        // "setup"(設定画面) | "running"(実行中) | "finished"(完了画面)
  wakeTime: "08:00",
  leaveTime: "09:00",
  tasks: DEFAULT_TASKS,
  voiceEnabled: true,     // 音声サポート ON/OFF(見ながら/音を出せない場面ではOFFにできる)
  // --- 実行中のみ使う値 ---
  currentIndex: 0,
  remainingSeconds: 0,
  taskDeadline: null,      // 現在タスクが「0:00になる瞬間」の絶対時刻(Date)。
                            // スリープ復帰後もここから正しく再計算するために使う。
  startedAt: null,        // 開始した瞬間のDate
  plannedStops: [],        // タイムテーブル表示用(開始時に計算した予定時刻)
  announced10: false,      // 出発まで10分の音声案内を出したか
  announced5: false,       // 出発まで5分の音声案内を出したか
};

let tickTimer = null; // setInterval のID

// ==========================================================
// 保存/読み込み(window.storage = クラウド側の永続保存API)
// ==========================================================
async function loadConfig(){
  try{
    const res = await window.storage.get("grwm-config"); // 個人用データとして保存
    if(res && res.value){
      const saved = JSON.parse(res.value);
      state.wakeTime = saved.wakeTime || state.wakeTime;
      state.leaveTime = saved.leaveTime || state.leaveTime;
      if(typeof saved.voiceEnabled === "boolean") state.voiceEnabled = saved.voiceEnabled;
      if(Array.isArray(saved.tasks) && saved.tasks.length){
        state.tasks = saved.tasks;
      }
    }
  }catch(e){
    // 保存データがまだ無い場合はここに来る → デフォルトのまま進めばOK
    console.log("保存データなし。デフォルト設定で開始します。", e);
  }
  render();
}

let saveTimeout = null;
function saveConfig(){
  // 入力のたびに毎回保存すると通信が多くなるので、300ms待って最後の1回だけ保存する
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async ()=>{
    try{
      await window.storage.set("grwm-config", JSON.stringify({
        wakeTime: state.wakeTime,
        leaveTime: state.leaveTime,
        voiceEnabled: state.voiceEnabled,
        tasks: state.tasks
      }), false); // false = 自分専用データ(他の人には見えない)
    }catch(e){ console.error("保存に失敗しました", e); }
  }, 300);
}

// ==========================================================
// 時刻まわりのユーティリティ
// ==========================================================
function fmtClock(d){
  return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0");
}
function fmtCountdown(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s/60);
  const ss = s%60;
  return m.toString().padStart(2,"0")+":"+ss.toString().padStart(2,"0");
}
function fmtHM(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  if(h>0) return h+"時間"+m+"分";
  return m+"分";
}
// 出発までの残り時間をタスクの秒数カウントと同じ「MM:SS」形式で表示するための関数。
// 60分を超える場合だけ H:MM:SS にする(通常の朝の準備時間なら基本 MM:SS で収まる)。
function fmtCountdownLong(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const ss = s%60;
  if(h>0) return h+":"+m.toString().padStart(2,"0")+":"+ss.toString().padStart(2,"0");
  return m.toString().padStart(2,"0")+":"+ss.toString().padStart(2,"0");
}
// "09:00" のような文字列 → 今日のその時刻のDateオブジェクトに変換
function timeStrToDate(str){
  const [h,m] = str.split(":").map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

// ==========================================================
// 効果音・バイブ(タスクが切り替わった合図)
// ==========================================================
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  }catch(e){ /* 音が出せない環境なら無視 */ }
  if(navigator.vibrate) navigator.vibrate(200);
}

// ==========================================================
// 音声サポート(声でタスクを知らせる)
// ------------------------------------------------------------
// ブラウザ標準のspeechSynthesis(読み上げ機能)を使用。
// state.voiceEnabled が false の時は何も話さない(音を出せない場面用)。
// ==========================================================
function speak(text){
  if(!state.voiceEnabled) return;
  try{
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel(); // 前の読み上げが残っていたら止めてから話す
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ja-JP";
    utter.rate = 1.05;
    window.speechSynthesis.speak(utter);
  }catch(e){ /* 読み上げに対応していない環境は無視 */ }
}
function toggleVoice(){
  state.voiceEnabled = !state.voiceEnabled;
  saveConfig();
  render();
  if(state.voiceEnabled) speak("音声サポートをオンにしました");
}

// ==========================================================
// 画面スリープ防止(Screen Wake Lock API)
// ------------------------------------------------------------
// 「スマホを触らないとすぐ画面が暗くなる」問題への対策。
// 実行中はこれをリクエストし、画面が自動で暗くならないようにする。
// 対応: iOS Safari 16.4以降、Android Chromeなど。非対応環境では何もしない。
// 注意: これはあくまで「自動スリープを防ぐ」機能で、
//   自分でロックボタンを押したり他アプリに切り替えた場合は防げない。
// ==========================================================
let wakeLock = null;
async function requestWakeLock(){
  try{
    if("wakeLock" in navigator){
      wakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){ /* 非対応・許可されない環境は無視して通常動作にフォールバック */ }
}
function releaseWakeLock(){
  if(wakeLock){
    wakeLock.release().catch(()=>{});
    wakeLock = null;
  }
}

// ==========================================================
// 「ながら準備(PinP)」機能
// ------------------------------------------------------------
// 仕組み:
//   1. 見えないcanvasに「タスク名・残り時間」を毎秒描画する
//   2. canvas.captureStream() で、その描画を"動画のストリーム"に変換
//   3. その映像を見えないvideo要素に流し込んで再生する
//   4. video.requestPictureInPicture() を呼ぶと、
//      YouTube動画などと同じ「小窓(常に最前面)」として表示される
//   → 他のタブ・他のアプリ(YouTube等)を操作していても、
//     この小窓だけは画面の上に浮かんだまま残る
//   小窓の中身はHouse Green×Goldの配色にして、本体UIとトーンを合わせている
// 対応環境: PC版Chrome/Edge/Safari、iOS Safari、Android Chromeは概ね対応。
//   PC版Firefoxなど一部ブラウザは非対応の場合があります。
// ==========================================================
let pipStreamStarted = false;

// 映像ストリームの準備(canvas→video)は、タップより"前"にあらかじめ済ませておく。
// iOS Safariは「タップ→即requestPictureInPicture()」という一直線の流れじゃないと
// 「ユーザー操作から呼ばれた」と認めてくれず拒否するため、準備はここで先にやっておく。
function setupPipStream(){
  if(pipStreamStarted) return;
  const canvas = document.getElementById("pipCanvas");
  const video = document.getElementById("pipVideo");
  drawPipFrame();
  const stream = canvas.captureStream(2); // 1〜2fpsで十分(数字が変わる程度の更新)
  video.srcObject = stream;
  video.play().catch(()=>{ /* mutedなのでほぼ失敗しない想定 */ });
  pipStreamStarted = true;
}

function drawPipFrame(){
  const canvas = document.getElementById("pipCanvas");
  if(!canvas || state.screen !== "running") return;
  const ctx = canvas.getContext("2d");
  const task = state.tasks[state.currentIndex];
  const budget = computeBudget();
  const behind = budget.buffer < 0;

  // 背景(House Green)
  ctx.fillStyle = "#1E3932";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.textAlign = "center";

  // 出発までの残り時間(一番見たい情報 → 一番大きく)
  ctx.fillStyle = behind ? "#ff9a8f" : "#cba258";
  ctx.font = "700 46px Georgia, serif";
  ctx.fillText((budget.secondsUntilLeave<0?"-":"")+fmtCountdownLong(Math.abs(budget.secondsUntilLeave)), canvas.width/2, 78);
  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.font = "500 12px sans-serif";
  ctx.fillText(behind ? "遅刻しそうです" : "出発まで", canvas.width/2, 96);

  // 現在のタスク名と作業時間(脇役・小さく)
  ctx.fillStyle = "rgba(255,255,255,.85)";
  ctx.font = "600 15px sans-serif";
  ctx.fillText(task ? task.name : "完了", canvas.width/2, 130);
  ctx.fillStyle = "rgba(255,255,255,.6)";
  ctx.font = "500 16px monospace";
  ctx.fillText(fmtCountdown(state.remainingSeconds), canvas.width/2, 152);
}

// ボタンのクリックから「間に何のawaitも挟まず」直接呼ぶのがポイント(iOS Safari対策)。
// なのでこの関数自体はasyncにしない。
function togglePip(){
  const video = document.getElementById("pipVideo");

  // すでに小窓が出ていれば閉じる
  if(document.pictureInPictureElement || video.webkitPresentationMode === "picture-in-picture"){
    if(document.exitPictureInPicture) document.exitPictureInPicture().catch(()=>{});
    if(video.webkitSetPresentationMode) video.webkitSetPresentationMode("inline");
    return;
  }

  setupPipStream(); // 未準備ならここで用意(通常はstartRoutine時点で準備済み)

  // --- iOS/macOS Safari専用のPinP API ---
  // Safariは標準API(requestPictureInPicture)より先にこちらを試す必要がある
  if(video.webkitSupportsPresentationMode && typeof video.webkitSetPresentationMode === "function"){
    video.webkitSetPresentationMode("picture-in-picture");
    return;
  }

  // --- Chrome/Edgeなど標準API ---
  if(video.requestPictureInPicture){
    video.requestPictureInPicture().catch(()=>{
      alert("PinPを開始できませんでした。もう一度ボタンをタップしてお試しください。");
    });
  }else{
    alert("お使いのブラウザは「見ながら準備(PinP)」に対応していません。");
  }
}

// ==========================================================
// 実行モードのロジック
// ==========================================================
function activeTasks(){
  // done でも skipped でもないタスクの並び
  return state.tasks;
}
function firstUnfinishedIndex(from){
  let i = from;
  while(i < state.tasks.length && (state.tasks[i].done || state.tasks[i].skipped)) i++;
  return i;
}

function startRoutine(){
  state.tasks = state.tasks.map(t=>({...t, done:false, skipped:false}));
  state.currentIndex = firstUnfinishedIndex(0);
  state.startedAt = new Date();
  state.announced10 = false;
  state.announced5 = false;
  state.announced20 = false;

  // タイムテーブル用に「予定時刻」を最初に一度だけ計算しておく
  let cursor = new Date(state.startedAt);
  state.plannedStops = state.tasks.map(t=>{
    const at = new Date(cursor);
    cursor = new Date(cursor.getTime() + t.seconds*1000);
    return { id:t.id, at };
  });

  if(state.currentIndex < state.tasks.length){
    const task = state.tasks[state.currentIndex];
    // "残り秒数"ではなく「いつ0:00になるか」という絶対時刻で管理する。
    // こうすることで、スリープなどでtickが飛んでも次にrecompute()した瞬間に
    // 正しい残り時間へ復帰できる(単純に毎秒1引くだけだと、寝てる間の分がズレて消えてしまう)。
    state.taskDeadline = new Date(Date.now() + task.seconds*1000);
    state.remainingSeconds = task.seconds;
    speak(`${task.name}の時間です`);
  }
  state.screen = "running";
  clearInterval(tickTimer);
  tickTimer = setInterval(recompute, 1000);
  render();
  setupPipStream(); // 映像ストリームをここで先に用意しておく(PinPタップ時に間を空けないため)
  requestWakeLock(); // 画面がすぐスリープしないようにする(対応環境のみ)
}

// ==========================================================
// 実際の時刻をもとに「今どうなっているべきか」を再計算する。
// 1秒ごとのtickだけでなく、スリープ復帰時(visibilitychange)にも呼ぶことで、
// 「スリープしてる間に進んでるのか分からない」問題に対応する。
// ==========================================================
function recompute(){
  if(state.screen !== "running") return;
  const now = new Date();
  state.remainingSeconds = Math.round((state.taskDeadline - now)/1000);

  if(state.remainingSeconds <= 0){
    completeTask(true); // 時間切れ→自動で次のタスクへ(ここでrender済み)
    return;
  }
  checkVoiceThresholds();
  render();
  drawPipFrame();
}
// 過去のコードとの互換用(setIntervalの呼び先名を変更したための別名)
function tick(){ recompute(); }

// 出発までの残り時間が20分・10分・5分を切ったタイミングで一度だけ声で知らせる。
// 「作業が遅れている分」ではなく、単純な「出発時刻までの実時間」を基準にする。
function checkVoiceThresholds(){
  const budget = computeBudget();
  const t = budget.secondsUntilLeave;
  if(t > 0 && t <= 1200 && !state.announced20){
    state.announced20 = true;
    speak("出発まで残り20分です");
  }
  if(t > 0 && t <= 600 && !state.announced10){
    state.announced10 = true;
    speak("出発まで残り10分です");
  }
  if(t > 0 && t <= 300 && !state.announced5){
    state.announced5 = true;
    speak("出発まで残り5分です");
  }
}

function completeTask(auto){
  const task = state.tasks[state.currentIndex];
  if(task) task.done = true;
  if(auto) beep();
  advance();
}
function skipTask(index){
  const task = state.tasks[index];
  if(task) task.skipped = true;
  if(index === state.currentIndex) advance();
  else render();
}
function advance(){
  const next = firstUnfinishedIndex(state.currentIndex+1);
  state.currentIndex = next;
  if(next >= state.tasks.length){
    finishRoutine();
    return;
  }
  const task = state.tasks[next];
  state.taskDeadline = new Date(Date.now() + task.seconds*1000);
  state.remainingSeconds = task.seconds;
  render();
  drawPipFrame();
  speak(`${task.name}の時間です`);
  // 画面が切り替わったタイルにフェード演出を付ける
  const tile = document.querySelector(".tile");
  if(tile){ tile.classList.add("flip"); setTimeout(()=>tile.classList.remove("flip"),320); }
}
function extendCurrent(sec){
  state.taskDeadline = new Date(state.taskDeadline.getTime() + sec*1000);
  state.remainingSeconds += sec;
  render();
}
function finishRoutine(){
  clearInterval(tickTimer);
  releaseWakeLock();
  state.screen = "finished";
  render();
}
function stopAndReset(){
  clearInterval(tickTimer);
  releaseWakeLock();
  state.tasks = state.tasks.map(t=>({...t, done:false, skipped:false}));
  state.screen = "setup";
  render();
}

// 「予定終了時刻に対して間に合うか」を計算(常にDate.now()基準なので、
// tickが多少飛んでもここを呼び直せば必ず正しい値になる)
function computeBudget(){
  const now = new Date();
  const leave = timeStrToDate(state.leaveTime);
  const secondsUntilLeave = (leave - now)/1000;

  // 残りタスク(現在のタスクは残り時間、それ以降は満額)の合計秒数
  let remainingWork = state.remainingSeconds;
  for(let i=state.currentIndex+1;i<state.tasks.length;i++){
    const t = state.tasks[i];
    if(!t.done && !t.skipped) remainingWork += t.seconds;
  }
  return { secondsUntilLeave, remainingWork, buffer: secondsUntilLeave - remainingWork };
}

// ==========================================================
// 描画(render) — stateの中身を見てHTMLを作り直す
// ==========================================================
function render(){
  const app = document.getElementById("app");
  if(state.screen === "setup") app.innerHTML = renderSetup();
  else if(state.screen === "running") app.innerHTML = renderRunning();
  else app.innerHTML = renderFinished();
  bindEvents();
}

function renderHeader(activeMode){
  return `
  <header class="app-head">
    <h1>GRWM <b>TIMER</b></h1>
    <div style="display:flex;align-items:center;gap:8px">
      <button class="voice-toggle ${state.voiceEnabled?'on':''}" data-act="togglevoice" title="音声サポート">${state.voiceEnabled ? "🔊" : "🔈"}</button>
      <div class="mode-switch">
        <button data-nav="setup" class="${activeMode==='setup'?'active':''}">設定</button>
        <button data-nav="running" class="${activeMode!=='setup'?'active':''}" ${state.screen==='setup'?'disabled':''}>実行</button>
      </div>
    </div>
  </header>`;
}

function renderSetup(){
  const total = state.tasks.reduce((s,t)=>s+t.seconds,0);
  const wake = timeStrToDate(state.wakeTime);
  const leave = timeStrToDate(state.leaveTime);
  const available = (leave-wake)/1000;
  const over = total > available;

  const rows = state.tasks.map((t,i)=>`
    <div class="task-row" data-id="${t.id}">
      <div class="order-btns">
        <button data-act="up" data-i="${i}" ${i===0?'disabled':''}>▲</button>
        <button data-act="down" data-i="${i}" ${i===state.tasks.length-1?'disabled':''}>▼</button>
      </div>
      <button class="star ${t.priority==='low'?'low':''}" data-act="priority" data-i="${i}" title="必須/スキップ可の切替">★</button>
      <input type="text" data-act="name" data-i="${i}" value="${escapeHtml(t.name)}">
      <input type="number" min="0" step="0.5" data-act="min" data-i="${i}" value="${(t.seconds/60).toString()}">
      <button class="del" data-act="del" data-i="${i}">×</button>
    </div>`).join("");

  return `
    ${renderHeader('setup')}
    <button class="start-btn-top" id="startBtnTop">この内容でスタート ▶</button>
    <div class="setup-block">
      <h2>起床 → 出発</h2>
      <div class="time-row">
        <div class="field"><label>起きる時刻</label><input type="time" id="wakeInput" value="${state.wakeTime}"></div>
        <div class="field"><label>家を出る時刻</label><input type="time" id="leaveInput" value="${state.leaveTime}"></div>
      </div>
      <div class="budget-note ${over?'over':''}">
        タスク合計 ${fmtHM(total)} / 使える時間 ${fmtHM(available)}
        ${over ? "　⚠️ 合計時間がオーバーしています。時間を減らすか起床を早めましょう" : "　✓ 時間内に収まっています"}
      </div>
    </div>

    <div class="setup-block">
      <h2>タスク一覧(★=必須 / 白抜き=遅れた時にスキップ候補)</h2>
      ${rows}
      <div class="add-row">
        <input type="text" id="newName" placeholder="新しいタスク名">
        <input type="number" id="newMin" placeholder="分" min="0" step="0.5" value="2">
        <button class="btn" id="addTaskBtn">追加</button>
      </div>
    </div>

    <button class="start-btn" id="startBtn">この内容でスタート ▶</button>
    <div class="save-note">入力内容は自動で保存されます</div>
  `;
}

function renderRunning(){
  const task = state.tasks[state.currentIndex];
  const nextTask = state.tasks.slice(state.currentIndex+1).find(t=>!t.done && !t.skipped);
  const budget = computeBudget();
  const behind = budget.buffer < 0;

  const doneCount = state.tasks.filter(t=>t.done||t.skipped).length;
  const pct = Math.round(doneCount/state.tasks.length*100);

  const stops = state.tasks.map((t,i)=>{
    const planned = state.plannedStops.find(p=>p.id===t.id);
    let cls = "timeline-row";
    let status = "";
    if(t.done){ cls+=" done"; status="✓ 完了"; }
    else if(t.skipped){ cls+=" skipped"; status="スキップ"; }
    else if(i===state.currentIndex){ cls+=" current"; status="▶ 実行中"; }
    return `<div class="${cls}">
      <div class="timeline-icon">${pickIcon(t.name)}</div>
      <div class="timeline-body">
        <div class="timeline-name">${escapeHtml(t.name)}</div>
        <div class="timeline-time">${planned?fmtClock(planned.at):""}</div>
        ${status?`<div class="timeline-status">${status}</div>`:""}
      </div>
    </div>`;
  }).join("");

  const lowPriorityCandidates = state.tasks
    .map((t,i)=>({...t,i}))
    .filter(t=>!t.done && !t.skipped && t.priority==='low' && t.i>state.currentIndex);

  return `
    ${renderHeader('running')}

    <!-- 出発までの残り時間と現在のタスクは画面上部に固定表示 -->
    <div class="sticky-top">
      <div class="board">
        <div class="board-label">${behind ? 'このままだと遅刻します' : '出発まで残り'}</div>
        <div class="board-hero ${behind?'warn':''}">${budget.secondsUntilLeave<0?'-':''}${fmtCountdownLong(Math.abs(budget.secondsUntilLeave))}</div>
        <div class="board-sub">出発予定 ${state.leaveTime}　・　現在 ${fmtClock(new Date())}</div>
      </div>

      <div class="tile">
        <div class="tile-eyebrow">TASK ${state.currentIndex+1} / ${state.tasks.length}</div>
        <div class="tile-task">${escapeHtml(task.name)}</div>
        <div class="tile-count ${behind?'behind':''}">${fmtCountdown(state.remainingSeconds)}</div>
        <div class="tile-next">${nextTask ? "次: "+escapeHtml(nextTask.name) : "これが最後のタスクです"}</div>
        <div class="tile-actions">
          <button class="btn" data-act="extend">+30秒</button>
          <button class="btn primary" data-act="complete">完了 ✓</button>
          <button class="btn warn" data-act="skip">スキップ</button>
        </div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-text">${doneCount} / ${state.tasks.length} 完了</div>
    </div>

    <!-- スケジュール全体は縦スクロールのタイムラインで表示 -->
    <div class="timeline">${stops}</div>

    <button class="btn ghost" style="width:100%" data-act="stop">中断して設定に戻る</button>

    <!-- Starbucksの "Frap" フローティングCTAを踏襲した、常時アクセスできる丸ボタン -->
    <button class="frap-btn" data-act="pip" title="ながら準備で見る(小窓表示)">📺</button>
  `;
}

function renderFinished(){
  const doneCount = state.tasks.filter(t=>t.done).length;
  const skipCount = state.tasks.filter(t=>t.skipped).length;
  const now = new Date();
  const leave = timeStrToDate(state.leaveTime);
  const onTime = now <= leave;
  return `
    ${renderHeader('running')}
    <div class="finish">
      <div class="big ${onTime?'reward':''}">${onTime ? "🎉 間に合いました！" : "お疲れさまでした"}</div>
      <p>完了 ${doneCount}件 / スキップ ${skipCount}件<br>現在時刻 ${fmtClock(now)}(出発予定 ${state.leaveTime})</p>
      <button class="btn primary" style="margin-top:16px" data-act="backToSetup">設定画面に戻る</button>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// タスク名から人物向けの汎用アイコン(絵文字)を推測する。
// 猫アプリのような専用イラストではなく、誰でも意味が分かる一般的な絵文字を使用。
// 該当が無ければ「・」を表示。
function pickIcon(name){
  const table = [
    [/起きる|起床/, "⏰"],
    [/トイレ/, "🚻"],
    [/顔.*洗|洗顔/, "🧼"],
    [/化粧水|美容液|乳液|クリーム|スキンケア/, "🧴"],
    [/着替え/, "👕"],
    [/ヘアオイル|ドライヤー|コテ|アイロン|ワックス|ヘア/, "💇"],
    [/日焼け止め|ファンデ|パウダー|ビューラー|アイ|マスカラ|リップ|チーク|シェーディング|ハイライト|メイク|スプレー/, "💄"],
    [/お湯|沸かす/, "☕"],
    [/ごはん|朝食|食べ/, "🍚"],
    [/皿.*洗/, "🍽️"],
    [/お弁当|水筒|バッグ/, "🎒"],
    [/家を出る|出発/, "🚪"],
  ];
  for(const [re,icon] of table){ if(re.test(name)) return icon; }
  return "・";
}

// ==========================================================
// イベント紐付け(render()のたびに呼び直す)
// ==========================================================
function bindEvents(){
  // ヘッダーのモード切替
  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const target = btn.getAttribute("data-nav");
      if(target === "setup" && state.screen !== "setup"){
        if(confirm("設定画面に戻ると現在の実行はリセットされます。よろしいですか?")) stopAndReset();
      }
    });
  });
  const voiceBtn = document.querySelector('[data-act="togglevoice"]');
  if(voiceBtn) voiceBtn.addEventListener("click", toggleVoice);

  if(state.screen === "setup"){
    const wakeInput = document.getElementById("wakeInput");
    const leaveInput = document.getElementById("leaveInput");
    wakeInput.addEventListener("change", e=>{ state.wakeTime=e.target.value; saveConfig(); render(); });
    leaveInput.addEventListener("change", e=>{ state.leaveTime=e.target.value; saveConfig(); render(); });

    document.querySelectorAll('[data-act="name"]').forEach(inp=>{
      inp.addEventListener("change", e=>{
        state.tasks[+e.target.dataset.i].name = e.target.value; saveConfig();
      });
    });
    document.querySelectorAll('[data-act="min"]').forEach(inp=>{
      inp.addEventListener("change", e=>{
        const min = Math.max(0, parseFloat(e.target.value)||0);
        state.tasks[+e.target.dataset.i].seconds = Math.round(min*60);
        saveConfig(); render();
      });
    });
    document.querySelectorAll('[data-act="priority"]').forEach(btn=>{
      btn.addEventListener("click", e=>{
        const i = +e.target.dataset.i;
        state.tasks[i].priority = state.tasks[i].priority==='high' ? 'low' : 'high';
        saveConfig(); render();
      });
    });
    document.querySelectorAll('[data-act="del"]').forEach(btn=>{
      btn.addEventListener("click", e=>{
        state.tasks.splice(+e.target.dataset.i,1); saveConfig(); render();
      });
    });
    document.querySelectorAll('[data-act="up"]').forEach(btn=>{
      btn.addEventListener("click", e=>{
        const i = +e.target.dataset.i;
        [state.tasks[i-1], state.tasks[i]] = [state.tasks[i], state.tasks[i-1]];
        saveConfig(); render();
      });
    });
    document.querySelectorAll('[data-act="down"]').forEach(btn=>{
      btn.addEventListener("click", e=>{
        const i = +e.target.dataset.i;
        [state.tasks[i+1], state.tasks[i]] = [state.tasks[i], state.tasks[i+1]];
        saveConfig(); render();
      });
    });
    document.getElementById("addTaskBtn").addEventListener("click", ()=>{
      const name = document.getElementById("newName").value.trim();
      const min = Math.max(0, parseFloat(document.getElementById("newMin").value)||0);
      if(!name) return;
      state.tasks.push({ id:"t"+Date.now(), name, seconds:Math.round(min*60), priority:"low" });
      saveConfig(); render();
    });
    document.getElementById("startBtn").addEventListener("click", startRoutine);
    document.getElementById("startBtnTop").addEventListener("click", startRoutine);
  }

  if(state.screen === "running"){
    const act = (sel,fn)=>{ const el=document.querySelector(sel); if(el) el.addEventListener("click",fn); };
    act('[data-act="complete"]', ()=>completeTask(false));
    act('[data-act="skip"]', ()=>skipTask(state.currentIndex));
    act('[data-act="extend"]', ()=>extendCurrent(30));
    act('[data-act="stop"]', ()=>{ if(confirm("実行を中断して設定に戻りますか?")) stopAndReset(); });
    act('[data-act="pip"]', togglePip);
    document.querySelectorAll('[data-act="quickskip"]').forEach(chip=>{
      chip.addEventListener("click", e=>skipTask(+e.target.dataset.i));
    });
  }

  if(state.screen === "finished"){
    document.querySelector('[data-act="backToSetup"]').addEventListener("click", stopAndReset);
  }
}

// スリープ復帰・タブ復帰した瞬間に、実際の時刻をもとに即座に状態を再計算する。
// これが無いと「スリープ中は画面が固まったまま」になり、再開時に古い表示のまま
// 気づかず遅刻する、という今回の問題が起きる。
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible"){
    recompute();
    if(state.screen === "running") requestWakeLock(); // バックグラウンドで解除されるため再取得
  }
});

// ---- 起動 ----
loadConfig();
</script>
</body>
</html>
